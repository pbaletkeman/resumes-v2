[project]
name = "resumes-v2"
version = "0.1.0"
description = "Multi-agent resume optimization pipeline"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.0",
    "ollama>=0.4.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0",
    "python-docx>=1.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
    "uvicorn>=0.30",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "client", "config"]

[tool.pyright]
pythonVersion = "3.14"
include = ["app", "client", "config", "pipeline.py", "basic.py"]
exclude = ["tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "client", "config", "pipeline.py"]
branch = true
omit = [
    "tests/*",
    "wip_testing/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
]

